description = "Analysis of PNN and SCC"
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "streamlit",
    "tifffile",
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "cellpose",
    "matplotlib",
    "pandas",
    "aicspylibczi",
    "czifile",
    "skan",
    "seaborn",
    "plotly",
    "h5py>=3.16.0",
    "joblib>=1.5.3",
    "prefetch-generator>=1.0.3",
    "omegaconf>=2.3.1",
    "napari>=0.7.1",
    "scikit-learn>=1.7.2",
    "hydra-core>=1.3.4",
    "spacecutter>=0.2.1",
    "torchsort>=0.1.10",
    "tqdm>=4.68.4",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "pyqt6>=6.11.0",
]

[tool.uv]
package = false
